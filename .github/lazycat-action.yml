version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/rally.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: rallly
build:
  run_buildscript: false
images:
  - id: rallly
    target: service
    service: rallly
    source: lukevella/rallly
    channel: stable
    sort: semver
    tag_regex: '^\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
  - id: rallly_db
    target: service
    service: rallly_db
    source: library/postgres
    channel: custom
    sort: semver
    tag_regex: '^14\.\d+-alpine$'
    version_regex: '^(?P<version>14\.\d+)-alpine$'
    version_template: '{version}.0'
    delivery:
      mode: mirror
stores:
  official:
    # Official store publication is intentionally disabled; publish only to Miaomiao Store.
    enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Rally
    summary: "会议及日程安排软件"
